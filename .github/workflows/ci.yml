name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: triageops
          POSTGRES_PASSWORD: triageops_test
          POSTGRES_DB: triageops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL:         postgresql://triageops:triageops_test@localhost:5432/triageops_test
      REDIS_URL:            redis://localhost:6379/0
      OPENAI_API_KEY:       sk-test-key-ci
      SLACK_BOT_TOKEN:      xoxb-test
      SLACK_SIGNING_SECRET: test-signing-secret-32chars-here!
      BOOTSTRAP_API_KEY:    ci-bootstrap-key
      APP_ENV:              development
      SENTRY_DSN:           ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile $(find . -name "*.py" -not -path "*/__pycache__/*" -not -path "./.git/*")
          echo "All files compile OK"

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest tests/ -v --tb=short --timeout=30

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t triageops:${{ github.sha }} .

      - name: Verify image starts
        run: |
          docker run --rm \
            -e DATABASE_URL=postgresql://x:x@localhost/x \
            -e REDIS_URL=redis://localhost/0 \
            -e BOOTSTRAP_API_KEY=test \
            triageops:${{ github.sha }} \
            python -c "from main import create_app; print('App imports OK')"
