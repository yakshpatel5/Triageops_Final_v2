# alembic.ini — TriageOps Alembic configuration
# sqlalchemy.url is overridden by env.py from DATABASE_URL — leave blank here.

[alembic]
script_location = alembic
sqlalchemy.url =

# Revision file naming: timestamp_slug.py  e.g. 20250115_120000_add_escalation_events.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

prepend_sys_path = .
version_path_separator = os

[post_write_hooks]
# Uncomment to auto-format generated migration files:
# hooks = ruff
# ruff.type = exec
# ruff.entrypoint = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
